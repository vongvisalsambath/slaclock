name: Release

# Publishes SlaClock to nuget.org when a version tag is pushed (v0.1.0, v0.2.0, ...).
# Uses NuGet Trusted Publishing: no API key is stored anywhere. nuget.org trusts this
# repository and this workflow file (release.yml) through a policy on the owner's account.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write   # lets GitHub prove to nuget.org which repository and workflow is publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: dotnet build -c Release -p:Version=$VERSION
      - run: dotnet test -c Release --no-build
      - run: dotnet pack src/SlaClock -c Release --no-build -p:Version=$VERSION -o artifacts

      - name: Log in to nuget.org (short-lived key)
        id: login
        uses: NuGet/login@v1
        with:
          user: NUGET_USERNAME   # the nuget.org username; set before the first release

      - name: Publish
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
